name: Publish Python Package

on:
  push:
    branches:
      - main  # Publishes whenever the version in pyproject.toml is new
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository
      - name: Check out code
        uses: actions/checkout@v4

      # Step 2: Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'  # Set the desired Python version

      # Step 3: Install Poetry
      - name: Install Poetry
        run: pipx install poetry

      # Step 4: Publish to PyPI. Merges that don't bump the version are a
      # no-op instead of failing on "File already exists".
      - name: Publish to PyPI
        env:
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_TOKEN }}  # Use the PyPI token secret
        run: |
          poetry publish --build --skip-existing
